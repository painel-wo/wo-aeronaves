<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Turnos — WO Pernoite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.page{max-width:1400px;margin:0 auto;padding:1.5rem}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.header h1{font-size:22px;font-weight:500;color:#f8fafc}
.header p{font-size:12px;color:#475569;margin-top:3px}
.btn{padding:8px 18px;border-radius:8px;border:0.5px solid #334155;background:#1e293b;color:#94a3b8;font-size:13px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{background:#263348;color:#e2e8f0}
.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}

/* GRID DE TURNOS */
.turnos-grid{display:flex;flex-direction:column;gap:12px}

.turno-card{background:#1e293b;border-radius:12px;border:0.5px solid #334155;overflow:hidden}
.turno-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:14px 18px;cursor:pointer}
.turno-header:hover{background:#263348}
.turno-date{font-size:15px;font-weight:500;color:#f8fafc}
.turno-sub{font-size:11px;color:#64748b;margin-top:2px}
.turno-kpis{display:flex;gap:14px;flex-wrap:wrap}
.tkpi{text-align:center;min-width:50px}
.tkpi-n{font-size:17px;font-weight:500;color:#f8fafc;line-height:1}
.tkpi-l{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.tkpi-n.verde{color:#4ade80}
.tkpi-n.amarelo{color:#fbbf24}
.tkpi-n.vermelho{color:#f87171}
.tkpi-n.laranja{color:#fcd34d}
.turno-arrow{font-size:12px;color:#475569;transition:transform .2s}
.turno-arrow.open{transform:rotate(90deg)}

/* DETALHE DO TURNO */
.turno-detail{display:none;border-top:0.5px solid #334155}
.turno-detail.open{display:block}

.aero-section{border-bottom:0.5px solid #1e293b}
.aero-section:last-child{border-bottom:none}
.aero-header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#162032;cursor:pointer;flex-wrap:wrap}
.aero-header:hover{background:#1a2840}
.aero-code{font-size:13px;font-weight:500;color:#93c5fd}
.aero-tech{font-size:11px;color:#64748b}
.aero-stats{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.astat{font-size:11px;color:#94a3b8}
.aero-arrow{font-size:10px;color:#475569;transition:transform .2s}
.aero-arrow.open{transform:rotate(90deg)}

/* WOs */
.wo-list-wrap{display:none;padding:0 18px 12px 32px}
.wo-list-wrap.open{display:block}
.wo-item{border:0.5px solid #1e293b;border-radius:8px;margin-top:8px;overflow:hidden}
.wo-item.concluida{border-color:#052e16}
.wo-item.finding{border-color:#7f1d1d}
.wo-top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f172a;flex-wrap:wrap}
.wo-num{font-size:12px;font-weight:500;color:#e2e8f0}
.wo-desc{font-size:11px;color:#64748b;padding:6px 12px;line-height:1.4;border-bottom:0.5px solid #1e293b}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:500}
.b-done{background:#052e16;color:#4ade80}
.b-pend{background:#1e293b;color:#475569;border:0.5px solid #334155}
.b-find{background:#450a0a;color:#f87171}
.b-deferred{background:#422006;color:#fcd34d;border:0.5px solid #92400e}
.mtl-ok{background:#052e16;color:#4ade80;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:500}
.mtl-nhe{background:#422006;color:#fbbf24;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:500}
.mtl-tst{background:#3b0764;color:#d8b4fe;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:500}

/* OBS */
.obs-section{padding:8px 12px}
.obs-label{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.obs-row{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:4px 0;border-bottom:0.5px solid #1e293b;align-items:start}
.obs-row:last-child{border-bottom:none}
.obs-time{font-size:10px;color:#64748b;font-variant-numeric:tabular-nums}
.obs-txt{font-size:11px;color:#94a3b8;line-height:1.4}
.obs-txt.lider{color:#60a5fa}

/* FINDINGS */
.find-section{padding:6px 12px;border-top:0.5px solid #1e293b}
.find-row{font-size:11px;padding:3px 0}
.find-row.open{color:#f87171}
.find-row.resolved{color:#4ade80}

/* EMPTY / LOADING */
.loading{text-align:center;padding:4rem;color:#475569}
.spinner{width:30px;height:30px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:4rem;color:#475569;font-size:14px}

@media(max-width:700px){.turno-kpis{gap:12px}.tkpi-n{font-size:15px}}

/* TÍTULO DAS SEÇÕES */
.visao-dia-title{font-size:12px;font-weight:500;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;padding:6px 4px}

/* TOTAL GERAL */
.total-geral{background:linear-gradient(135deg,#1e293b,#162032);border-radius:12px;border:0.5px solid #334155;padding:1.25rem;margin-top:1rem}
.total-geral-title{font-size:13px;font-weight:500;color:#f8fafc;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:0.5px solid #334155;padding-bottom:10px}
.total-geral-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.total-geral-grid{grid-template-columns:repeat(2,1fr)}}
.tg-item{text-align:center;background:#0f172a;border-radius:8px;padding:12px 6px;border:0.5px solid #1e293b}
.tg-n{font-size:22px;font-weight:600;color:#f8fafc;line-height:1}
.tg-n.verde{color:#4ade80}
.tg-n.laranja{color:#fcd34d}
.tg-n.vermelho{color:#f87171}
.tg-l{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
.tg-motivos-title{font-size:11px;font-weight:500;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-top:10px;margin-bottom:8px;border-top:0.5px solid #334155;padding-top:12px}
.tg-motivo-row{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#0f172a;border-radius:6px;margin-bottom:5px;font-size:12px;color:#fcd34d;border-left:3px solid #d97706}
.tg-motivo-count{font-weight:500;color:#f8fafc;background:#422006;padding:2px 9px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>📋 Histórico de Turnos</h1>
      <p>Todos os turnos encerrados com detalhes completos</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="exportarExcel(this)" style="background:#052e16;border-color:#166534;color:#4ade80">📊 Exportar Excel</button>
      <button class="btn" onclick="exportarPDF(this)" style="background:#450a0a;border-color:#7f1d1d;color:#fca5a5">📄 Exportar PDF</button>
      <a href="painel-realtime.html" class="btn">← Voltar ao Painel</a>
    </div>
  </div>

  <div class="turnos-grid" id="turnos-grid">
    <div class="loading"><div class="spinner"></div><p>Carregando histórico...</p></div>
  </div>
</div>

<script>
const URL_='https://owyohcqjyiqhabonnstq.supabase.co';
const KEY='sb_publishable_dRyY_MRg5XHvXpRiilARMQ_5ZjMxRkL';
const sb=window.supabase.createClient(URL_,KEY);

// Sistema de Logging
const LOG={
  info:(msg)=>console.log(`ℹ️ [WO] ${msg}`),
  warn:(msg)=>console.warn(`⚠️ [WO] ${msg}`),
  error:(msg)=>console.error(`❌ [WO] ${msg}`),
  success:(msg)=>console.log(`✅ [WO] ${msg}`)
};

// ═══════════════════════════════════════════════════════════
// SISTEMA DE ERROS CENTRALIZADO — MRT Pernoite
// ═══════════════════════════════════════════════════════════
const ERROS = {
  // Banco de dados
  'ERR-001': 'Falha na conexão com o banco de dados',
  'ERR-002': 'Falha ao carregar aeronaves',
  'ERR-003': 'Falha ao carregar tarefas',
  'ERR-004': 'Falha ao salvar dados no banco',
  // Importação
  'ERR-010': 'Falha na importação do arquivo',
  'ERR-011': 'Arquivo inválido ou sem aeronaves com WO',
  'ERR-012': 'Formato de arquivo não suportado',
  'ERR-013': 'Falha ao processar PDF',
  'ERR-014': 'Falha ao processar planilha Excel',
  // Operações do técnico
  'ERR-020': 'Falha ao iniciar tarefa',
  'ERR-021': 'Falha ao concluir tarefa',
  'ERR-022': 'Falha ao diferir tarefa',
  'ERR-023': 'Falha ao registrar finding',
  'ERR-024': 'Falha ao salvar observação',
  'ERR-025': 'Falha ao resetar tarefa',
  // Turno
  'ERR-030': 'Falha ao encerrar turno',
  'ERR-031': 'Nenhuma WO encontrada para encerrar',
  'ERR-032': 'Falha ao salvar histórico do turno',
  // Realtime
  'ERR-040': 'Conexão em tempo real perdida',
  'ERR-041': 'Falha ao sincronizar dados',
  // Histórico / Gestores
  'ERR-050': 'Falha ao carregar histórico',
  'ERR-051': 'Falha ao exportar relatório',
};

function erroMRT(codigo, detalhes='', mostrarUsuario=true){
  const msg = ERROS[codigo] || 'Erro desconhecido';
  const texto = `[${codigo}] ${msg}${detalhes ? ': ' + detalhes : ''}`;
  console.error('❌ MRT ' + texto);
  if(mostrarUsuario){
    alert(`❌ ${msg}\n\nCódigo: ${codigo}\n${detalhes ? 'Detalhe: ' + detalhes : ''}\n\nAnote o código e informe ao suporte.`);
  }
  return texto;
}

// Captura erros globais não tratados
window.addEventListener('error', (e)=>{
  console.error(`❌ MRT [ERR-000] Erro inesperado: ${e.message} (${e.filename}:${e.lineno})`);
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error(`❌ MRT [ERR-000] Promessa rejeitada: ${e.reason?.message || e.reason}`);
});

// Heartbeat: mantém Supabase ativo
async function heartbeat(){try{await sb.from('aircrafts').select('id',{count:'exact',head:true});}catch(e){}}
heartbeat();

const openTurnos=new Set();
const openAeros=new Set();

async function load(){
  const grid=document.getElementById('turnos-grid');
  grid.innerHTML='<div class="empty">⏳ Carregando histórico...</div>';
  try{
    // Carregar turnos básicos primeiro (sem join pesado)
    const{data:turnos,error:e1}=await sb.from('turnos')
      .select('*')
      .order('criado_em',{ascending:false})
      .limit(50);
    if(e1)throw e1;
    if(!turnos||!turnos.length){
      grid.innerHTML='<div class="empty">📭 Nenhum turno encerrado ainda.<br>Use o botão "Encerrar Turno" no painel para salvar o histórico.</div>';
      return;
    }

    // Carregar aeronaves e tarefas separadamente
    const turnoIds=turnos.map(t=>t.id);
    const{data:aeronaves,error:e2}=await sb.from('turno_aeronaves')
      .select('*')
      .in('turno_id',turnoIds);
    if(e2)throw e2;

    const aeroIds=(aeronaves||[]).map(a=>a.id);
    let tarefas=[];
    if(aeroIds.length){
      const{data:tt,error:e3}=await sb.from('turno_tarefas')
        .select('*')
        .in('turno_aeronave_id',aeroIds);
      if(e3)throw e3;
      tarefas=tt||[];
    }

    // Montar estrutura aninhada manualmente
    const data=turnos.map(t=>{
      const aeros=(aeronaves||[])
        .filter(a=>a.turno_id===t.id)
        .map(a=>({
          ...a,
          turno_tarefas:tarefas.filter(tt=>tt.turno_aeronave_id===a.id)
        }));
      return{...t,turno_aeronaves:aeros};
    });

    // Calcular totais acumulados
    let gWO=0,gWOconc=0,gTar=0,gTarConc=0,gDef=0,gFind=0,gAero=0;
    const motivosGeral={};
    data.forEach(t=>{
      const aeros=t.turno_aeronaves||[];
      gAero+=aeros.length;
      gFind+=t.total_findings||0;
      aeros.forEach(a=>{
        const tasks=a.turno_tarefas||[];
        const wos=[...new Set(tasks.map(tk=>tk.wo_number))];
        gWO+=wos.length;
        wos.forEach(wo=>{
          const wt=tasks.filter(tk=>tk.wo_number===wo);
          if(wt.every(tk=>tk.concluida||tk.deferida)) gWOconc++;
        });
        tasks.forEach(tk=>{
          gTar++;
          if(tk.concluida) gTarConc++;
          if(tk.deferida){
            gDef++;
            const m=tk.defer_reason||'Não informado';
            motivosGeral[m]=(motivosGeral[m]||0)+1;
          }
        });
      });
    });

    const totalHtml=`<div class="total-geral">
      <div class="total-geral-title">📊 Visão Geral do Acumulado (${data.length} turno${data.length!==1?'s':''})</div>
      <div class="total-geral-grid">
        <div class="tg-item"><div class="tg-n">${gAero}</div><div class="tg-l">Aeronaves</div></div>
        <div class="tg-item"><div class="tg-n">${gWO}</div><div class="tg-l">WOs Total</div></div>
        <div class="tg-item"><div class="tg-n verde">${gWOconc}</div><div class="tg-l">WOs Encerradas</div></div>
        <div class="tg-item"><div class="tg-n">${gTar}</div><div class="tg-l">Tarefas Total</div></div>
        <div class="tg-item"><div class="tg-n verde">${gTarConc}</div><div class="tg-l">Tarefas Concluídas</div></div>
        <div class="tg-item"><div class="tg-n laranja">${gDef}</div><div class="tg-l">Deferidas</div></div>
        <div class="tg-item"><div class="tg-n ${gFind>0?'vermelho':'verde'}">${gFind}</div><div class="tg-l">Findings</div></div>
        <div class="tg-item"><div class="tg-n verde">${gTar?Math.round((gTarConc+gDef)/gTar*100):0}%</div><div class="tg-l">Eficiência</div></div>
      </div>
      ${Object.keys(motivosGeral).length?`
      <div class="tg-motivos-title">⏸ Motivos de Deferimento Acumulados</div>
      ${Object.entries(motivosGeral).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`
        <div class="tg-motivo-row">
          <span>${m}</span>
          <span class="tg-motivo-count">${n}x</span>
        </div>`).join('')}`:''}
    </div>`;

    grid.innerHTML=`<div class="visao-dia-title">📅 Visão por Dia</div>`+
      data.map(t=>renderTurno(t)).join('')+totalHtml;
  }catch(e){
    console.error('Erro ao carregar histórico:',e);
    erroMRT('ERR-050', e.message, false);
    grid.innerHTML=`<div class="empty">❌ [ERR-050] Erro ao carregar histórico.<br><small style="color:#475569">${e.message} — Verifique o console (F12)</small></div>`;
  }
}

function fmt(dt){
  if(!dt)return '—';
  const d=new Date(dt);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function renderTurno(t){
  const isOpen=openTurnos.has(t.id);
  const aeros=t.turno_aeronaves||[];
  const dataFmt=t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}):'—';

  // Calcular métricas reais do dia
  let tarTotal=0,tarConc=0,tarDef=0;
  aeros.forEach(a=>{
    const tasks=a.turno_tarefas||[];
    tasks.forEach(tk=>{
      tarTotal++;
      if(tk.concluida) tarConc++;
      if(tk.deferida) tarDef++;
    });
  });

  const aerosHtml=aeros.map(a=>renderAero(t.id,a)).join('');

  return `<div class="turno-card">
    <div class="turno-header" onclick="toggleTurno('${t.id}')">
      <div>
        <div class="turno-date">📅 ${dataFmt}</div>
        <div class="turno-sub">Encerrado em ${fmt(t.encerrado_em)} · ${t.total_aero} aeronave${t.total_aero!==1?'s':''}</div>
      </div>
      <div class="turno-kpis">
        <div class="tkpi"><div class="tkpi-n">${t.total_wo||0}</div><div class="tkpi-l">WOs</div></div>
        <div class="tkpi"><div class="tkpi-n verde">${t.wo_concluidas||0}</div><div class="tkpi-l">Encerradas</div></div>
        <div class="tkpi"><div class="tkpi-n">${tarTotal}</div><div class="tkpi-l">Tarefas</div></div>
        <div class="tkpi"><div class="tkpi-n verde">${tarConc}</div><div class="tkpi-l">Concluídas</div></div>
        <div class="tkpi"><div class="tkpi-n laranja">${tarDef}</div><div class="tkpi-l">Deferidas</div></div>
        <div class="tkpi"><div class="tkpi-n ${t.total_findings>0?'vermelho':'verde'}">${t.total_findings||0}</div><div class="tkpi-l">Findings</div></div>
        <div class="tkpi"><div class="tkpi-n ${t.pct_conclusao>=80?'verde':t.pct_conclusao>=50?'amarelo':'vermelho'}">${t.pct_conclusao||0}%</div><div class="tkpi-l">Conclusão</div></div>
      </div>
      <span class="turno-arrow ${isOpen?'open':''}" id="ta-${t.id}">▶</span>
    </div>
    <div class="turno-detail ${isOpen?'open':''}" id="td-${t.id}">
      ${aerosHtml||'<div style="padding:1rem;color:#475569;font-size:13px">Sem aeronaves registradas.</div>'}
    </div>
  </div>`;
}

function renderAero(turnoId,a){
  const key=`${turnoId}-${a.id}`;
  const isOpen=openAeros.has(key);
  const tasks=a.turno_tarefas||[];
  const mtlBadge=a.mtl_critico==='OK'?'<span class="mtl-ok">OK</span>':a.mtl_critico==='NHE'?'<span class="mtl-nhe">NHE</span>':a.mtl_critico==='TST'?'<span class="mtl-tst">TST</span>':'';

  const wosHtml=tasks.map(t=>renderWO(t)).join('');

  return `<div class="aero-section">
    <div class="aero-header" onclick="toggleAero('${key}')">
      <span class="aero-arrow ${isOpen?'open':''}" id="aa-${key}">▶</span>
      <div>
        <div class="aero-code">${a.codigo}</div>
        <div class="aero-tech">🪪 ${a.tecnico||'—'}</div>
      </div>
      <div class="aero-stats">
        <span class="astat">✓ ${a.wo_concluidas}/${a.wo_total} WOs</span>
        <span class="astat">${a.pct_conclusao}%</span>
        ${a.tem_finding?'<span class="badge b-find">⚠ Finding</span>':''}
        ${mtlBadge}
      </div>
    </div>
    <div class="wo-list-wrap ${isOpen?'open':''}" id="aw-${key}">
      ${wosHtml||'<div style="color:#475569;font-size:12px;padding:8px 0">Sem WOs registradas.</div>'}
    </div>
  </div>`;
}

function renderWO(task){
  const obs=(task.observacoes||[]);
  const finds=(task.findings||[]);
  const mtlB=task.material==='OK'?'<span class="mtl-ok">OK</span>':task.material==='NHE'?'<span class="mtl-nhe">NHE</span>':task.material==='TST'?'<span class="mtl-tst">TST</span>':'';

  const obsHtml=obs.length
    ?obs.map(o=>{
      const isLider=(o.author||'').toLowerCase().includes('líder')||(o.text||'').startsWith('[Líder]');
      const texto=(o.text||'').replace(/^\[Líder\]\s*/,'');
      return `<div class="obs-row">
        <div class="obs-time" style="color:${isLider?'#60a5fa':'#94a3b8'}">${o.recorded_at||'--:--'} ${isLider?'[Líder]':'[Téc]'}</div>
        <div class="obs-txt ${isLider?'lider':''}">${texto}</div>
      </div>`;
    }).join('')
    :'<div style="font-size:11px;color:#334155;padding:4px 0">Sem observações.</div>';

  const findHtml=finds.length
    ?finds.map(f=>`<div class="find-row ${f.resolved?'resolved':'open'}">${f.resolved?'✓':'⚠'} ${f.description||''}</div>`).join('')
    :'';

  return `<div class="wo-item ${task.concluida?'concluida':task.deferida?'concluida':task.has_finding?'finding':''}">
    <div class="wo-top">
      <span class="wo-num">WO ${task.wo_number}</span>
      ${task.concluida?'<span class="badge b-done">✓ Concluída</span>':task.deferida?`<span class="badge b-deferred">⏸ Deferida</span>`:task.has_finding?'<span class="badge b-find">⚠ Finding</span>':'<span class="badge b-pend">Pendente</span>'}
      ${mtlB}
      ${task.concluida_em?`<span style="font-size:10px;color:#64748b;margin-left:auto">Concluída às ${new Date(task.concluida_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>`:''}
      ${task.deferida&&task.defer_reason?`<span style="font-size:10px;color:#fcd34d;margin-left:auto">Motivo: ${task.defer_reason}</span>`:''}
    </div>
    ${task.descricao?`<div class="wo-desc">${task.descricao}</div>`:''}
    ${findHtml?`<div class="find-section">${findHtml}</div>`:''}
    <div class="obs-section">
      <div class="obs-label">Observações (${obs.length})</div>
      ${obsHtml}
    </div>
  </div>`;
}

function toggleTurno(id){
  const el=document.getElementById(`td-${id}`);
  const ar=document.getElementById(`ta-${id}`);
  if(openTurnos.has(id)){openTurnos.delete(id);el.classList.remove('open');ar.classList.remove('open');}
  else{openTurnos.add(id);el.classList.add('open');ar.classList.add('open');}
}

function toggleAero(key){
  const el=document.getElementById(`aw-${key}`);
  const ar=document.getElementById(`aa-${key}`);
  if(openAeros.has(key)){openAeros.delete(key);el.classList.remove('open');ar.classList.remove('open');}
  else{openAeros.add(key);el.classList.add('open');ar.classList.add('open');}
}

// Carregamento lazy de bibliotecas pesadas
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Falha ao carregar: '+src));
    document.head.appendChild(s);
  });
}

// EXPORTAR EXCEL
// ═══════════════════════════════════════
async function exportarExcel(btn){
  btn.textContent='⏳ Carregando...';btn.disabled=true;
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  btn.textContent='⏳ Gerando...';
  try{
    const{data,error}=await sb.from('turnos')
      .select('*,turno_aeronaves(*,turno_tarefas!turno_aeronave_id(*))')
      .order('criado_em',{ascending:false});
    if(error)throw error;

    const wb=XLSX.utils.book_new();

    // ── ABA 1: RESUMO GERAL ──
    const resumoRows=[
      ['HISTORICO DE TURNOS - WO PERNOITE'],
      [`Gerado em: ${new Date().toLocaleString('pt-BR')}`],
      [],
      ['Data','Encerrado em','Aeronaves','WOs Total','Concluidas','Pendentes','Findings','% Conclusao'],
    ];
    data.forEach(t=>{
      const d=t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR'):'—';
      const enc=t.encerrado_em?new Date(t.encerrado_em).toLocaleString('pt-BR'):'—';
      resumoRows.push([d,enc,t.total_aero,t.total_wo,t.wo_concluidas,t.wo_pendentes,t.total_findings,(t.pct_conclusao||0)+'%']);
    });
    const wsResumo=XLSX.utils.aoa_to_sheet(resumoRows);
    wsResumo['!cols']=[{wch:14},{wch:18},{wch:12},{wch:12},{wch:12},{wch:12},{wch:10},{wch:12}];
    // Estilo do título
    if(wsResumo['A1']) wsResumo['A1'].s={font:{bold:true,sz:14}};
    XLSX.utils.book_append_sheet(wb,wsResumo,'Resumo Geral');

    // ── ABA 2: DETALHE POR TURNO ──
    const detalheRows=[
      ['DETALHE POR TURNO - TODAS AS WOs E OBSERVACOES'],
      [`Gerado em: ${new Date().toLocaleString('pt-BR')}`],
      [],
      ['DATA TURNO','ENCERRADO EM','AERONAVE','TECNICO','WO','DESCRICAO','STATUS','MTL','FINDING','CONCLUIDA EM','HORA OBS','OBSERVACAO'],
    ];
    data.forEach(t=>{
      const dTurno=t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR'):'—';
      const encTurno=t.encerrado_em?new Date(t.encerrado_em).toLocaleString('pt-BR'):'—';
      const aeros=t.turno_aeronaves||[];
      aeros.forEach(a=>{
        const tasks=a.turno_tarefas||[];
        tasks.forEach(task=>{
          const obs=(task.observacoes||[]);
          const finds=(task.findings||[]).map(f=>(f.resolved?'[Resolvido] ':'')+f.description).join(' | ');
          const concHora=task.concluida_em?new Date(task.concluida_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
          if(obs.length===0){
            detalheRows.push([dTurno,encTurno,a.codigo,a.tecnico,task.wo_number,task.descricao,task.concluida?'Concluída':task.deferida?'Deferida':'Pendente',task.material||'',finds,concHora,'','']);
          } else {
            obs.forEach((o,i)=>{
              detalheRows.push([
                i===0?dTurno:'',
                i===0?encTurno:'',
                i===0?a.codigo:'',
                i===0?a.tecnico:'',
                i===0?task.wo_number:'',
                i===0?task.descricao:'',
                i===0?(task.concluida?'Concluída':task.deferida?'Deferida':'Pendente'):'',
                i===0?(task.material||''):'',
                i===0?finds:'',
                i===0?concHora:'',
                o.recorded_at||'',
                `[${o.author||'Técnico'}] ${o.text||''}`
              ]);
            });
          }
          detalheRows.push([]); // linha em branco entre tasks
        });
        detalheRows.push([]); // linha em branco entre aeronaves
      });
      detalheRows.push(['─'.repeat(20)]); // separador entre turnos
      detalheRows.push([]);
    });
    const wsDetalhe=XLSX.utils.aoa_to_sheet(detalheRows);
    wsDetalhe['!cols']=[{wch:14},{wch:18},{wch:10},{wch:22},{wch:10},{wch:45},{wch:12},{wch:6},{wch:30},{wch:12},{wch:8},{wch:50}];
    XLSX.utils.book_append_sheet(wb,wsDetalhe,'Detalhe Completo');

    // ── ABA 3: FINDINGS ──
    const findRows=[
      ['FINDINGS REGISTRADOS - TODOS OS TURNOS'],
      [`Gerado em: ${new Date().toLocaleString('pt-BR')}`],
      [],
      ['DATA TURNO','AERONAVE','TECNICO','WO','FINDING','STATUS'],
    ];
    data.forEach(t=>{
      const dTurno=t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR'):'—';
      (t.turno_aeronaves||[]).forEach(a=>{
        (a.turno_tarefas||[]).forEach(task=>{
          (task.findings||[]).forEach(f=>{
            findRows.push([dTurno,a.codigo,a.tecnico,task.wo_number,f.description,f.resolved?'Resolvido':'Aberto']);
          });
        });
      });
    });
    const wsFindings=XLSX.utils.aoa_to_sheet(findRows);
    wsFindings['!cols']=[{wch:14},{wch:10},{wch:22},{wch:10},{wch:50},{wch:12}];
    XLSX.utils.book_append_sheet(wb,wsFindings,'Findings');

    // Download
    const hoje=new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb,`WO_Historico_${hoje}.xlsx`);
    btn.textContent='📊 Exportar Excel';btn.disabled=false;
  }catch(e){
    alert('❌ Erro: '+e.message);
    btn.textContent='📊 Exportar Excel';btn.disabled=false;
  }
}

// EXPORTAR PDF
// ═══════════════════════════════════════
async function exportarPDF(btn){
  btn.textContent='⏳ Carregando...';btn.disabled=true;
  await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js');
  btn.textContent='⏳ Gerando...';
  try{
    const{data,error}=await sb.from('turnos')
      .select('*,turno_aeronaves(*,turno_tarefas!turno_aeronave_id(*))')
      .order('criado_em',{ascending:false});
    if(error)throw error;

    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const W=doc.internal.pageSize.getWidth();
    let y=15;

    // Função helpers
    const addPage=()=>{doc.addPage();y=15;};
    const checkY=(h=10)=>{if(y+h>195)addPage();};

    // CAPA
    doc.setFillColor(30,58,138);
    doc.rect(0,0,W,40,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(18);doc.setFont('helvetica','bold');
    doc.text('HISTORICO DE TURNOS - WO PERNOITE',W/2,18,{align:'center'});
    doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.text('Sistema de Gestao de Ordens de Trabalho',W/2,26,{align:'center'});
    doc.text('Gerado em: '+new Date().toLocaleString('pt-BR'),W/2,33,{align:'center'});
    y=50;

    // RESUMO GERAL
    doc.setTextColor(30,58,138);
    doc.setFontSize(13);doc.setFont('helvetica','bold');
    doc.text('RESUMO GERAL',14,y);y+=6;

    doc.autoTable({
      startY:y,
      head:[['Data','Encerrado em','Aeronaves','WOs','Concluidas','Pendentes','Findings','%']],
      body:data.map(t=>[
        t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR'):'—',
        t.encerrado_em?new Date(t.encerrado_em).toLocaleString('pt-BR'):'—',
        t.total_aero,t.total_wo,t.wo_concluidas,t.wo_pendentes,t.total_findings,(t.pct_conclusao||0)+'%'
      ]),
      styles:{fontSize:8,cellPadding:3},
      headStyles:{fillColor:[30,58,138],textColor:255,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[241,245,249]},
      columnStyles:{7:{fontStyle:'bold'}},
      margin:{left:14,right:14},
    });
    y=doc.lastAutoTable.finalY+12;

    // DETALHE POR TURNO
    data.forEach(t=>{
      const dTurno=t.data_turno?new Date(t.data_turno+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}):'—';
      const encTurno=t.encerrado_em?new Date(t.encerrado_em).toLocaleString('pt-BR'):'—';
      const aeros=t.turno_aeronaves||[];

      // Cabeçalho do turno
      checkY(20);
      doc.setFillColor(30,41,59);
      doc.rect(14,y,W-28,8,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(10);doc.setFont('helvetica','bold');
      doc.text('TURNO: '+dTurno+' | Encerrado: '+encTurno,16,y+5.5);
      doc.setFontSize(8);doc.setFont('helvetica','normal');
      doc.text(t.wo_concluidas+'/'+t.total_wo+' WOs ('+t.pct_conclusao+'%) | '+t.total_findings+' findings',W-16,y+5.5,{align:'right'});
      y+=12;

      aeros.forEach(a=>{
        const tasks=a.turno_tarefas||[];
        checkY(15);

        // Header aeronave
        doc.setFillColor(22,32,50);
        doc.rect(14,y,W-28,7,'F');
        doc.setTextColor(147,197,253);
        doc.setFontSize(9);doc.setFont('helvetica','bold');
        doc.text(a.codigo+' — '+a.tecnico,16,y+5);
        doc.setTextColor(148,163,184);
        doc.text(a.wo_concluidas+'/'+a.wo_total+' WOs | '+a.pct_conclusao+'%'+(a.tem_finding?' | ⚠ Finding':''),W-16,y+5,{align:'right'});
        y+=10;

        // Tabela de WOs
        const rows=[];
        tasks.forEach(task=>{
          const obs=(task.observacoes||[]);
          const finds=(task.findings||[]).map(f=>(f.resolved?'[OK] ':'')+f.description).join('\n');
          const obsText=obs.map(o=>`${o.recorded_at||''} [${o.author||'Téc'}] ${(o.text||'').replace(/^\[Líder\]\s*/,'')}`).join('\n');
          rows.push([
            task.wo_number||'',
            (task.descricao||'').substring(0,60)+(task.descricao?.length>60?'...':''),
            task.concluida?'Concluida':task.deferida?'Deferida':'Pendente',
            task.material||'—',
            finds||'—',
            obsText||'—'
          ]);
        });

        if(rows.length){
          doc.autoTable({
            startY:y,
            head:[['WO','Descricao','Status','MTL','Findings','Observacoes (hora - texto)']],
            body:rows,
            styles:{fontSize:7,cellPadding:2,overflow:'linebreak'},
            headStyles:{fillColor:[51,65,85],textColor:255,fontSize:7},
            columnStyles:{
              0:{cellWidth:18},
              1:{cellWidth:60},
              2:{cellWidth:18},
              3:{cellWidth:10},
              4:{cellWidth:35},
              5:{cellWidth:W-28-141}
            },
            margin:{left:14,right:14},
            didParseCell:(data)=>{
              if(data.column.index===2&&data.cell.raw==='Concluida'){
                data.cell.styles.textColor=[74,222,128];data.cell.styles.fontStyle='bold';
              }
              if(data.column.index===2&&data.cell.raw==='Pendente'){
                data.cell.styles.textColor=[251,191,36];
              }
            }
          });
          y=doc.lastAutoTable.finalY+6;
        }
      });
      y+=6;
    });

    const hoje=new Date().toISOString().split('T')[0];
    doc.save('WO_Historico_'+hoje+'.pdf');
    btn.textContent='📄 Exportar PDF';btn.disabled=false;
  }catch(e){
    alert('Erro ao gerar PDF: '+e.message);
    btn.textContent='📄 Exportar PDF';btn.disabled=false;
  }
}
